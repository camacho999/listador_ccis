<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/main.css')}}">
<title>Listador</title>
<style>
:root {
--primary-color: #4f46e5;
--primary-hover: #4338ca;
--secondary-color: #64748b;
--success-color: #10b981;
--background-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
--card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
--card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

body {
background-color: #f1f5f9;
font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

.navbar {
background: var(--background-gradient) !important;
box-shadow: var(--card-shadow);
border-radius: 0 0 12px 12px;
margin-bottom: 2rem;
}

.navbar-brand {
font-weight: 700;
font-size: 1.5rem;
color: white !important;
}

.nav-link {
color: rgba(255, 255, 255, 0.9) !important;
font-weight: 500;
transition: all 0.3s ease;
border-radius: 8px;
padding: 0.5rem 1rem !important;
}

.nav-link:hover {
background-color: rgba(255, 255, 255, 0.1);
color: white !important;
}

.nav-link.active {
background-color: rgba(255, 255, 255, 0.2);
color: white !important;
}

.card {
border: none;
border-radius: 12px;
box-shadow: var(--card-shadow);
background: white;
transition: all 0.3s ease;
}

.card:hover {
box-shadow: var(--card-shadow-hover);
}

.btn-primary {
background: var(--primary-color);
border: none;
border-radius: 8px;
padding: 0.5rem 1.5rem;
font-weight: 600;
transition: all 0.3s ease;
}

.btn-primary:hover {
background: var(--primary-hover);
transform: translateY(-2px);
box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
}

.form-control {
border-radius: 8px;
border: 2px solid #e2e8f0;
padding: 0.625rem 1rem;
transition: all 0.3s ease;
}

.form-control:focus {
border-color: var(--primary-color);
box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.input-group-text {
background: #f8fafc;
border: 2px solid #e2e8f0;
border-radius: 8px 0 0 8px;
font-weight: 600;
color: var(--secondary-color);
}

.table {
background: white;
border-radius: 12px;
overflow: hidden;
box-shadow: var(--card-shadow);
}

.table thead {
background: var(--background-gradient);
color: white;
}

.table thead th {
border: none;
font-weight: 600;
padding: 1rem;
}

.table tbody tr {
transition: all 0.2s ease;
}

.table tbody tr:hover {
background-color: #f8fafc;
transform: scale(1.005);
}

.badge {
padding: 0.35rem 0.75rem;
border-radius: 6px;
font-weight: 600;
}

.form-check-input:checked {
background-color: var(--primary-color);
border-color: var(--primary-color);
}

.filter-section {
background: white;
border-radius: 12px;
padding: 1.5rem;
box-shadow: var(--card-shadow);
margin-bottom: 1.5rem;
}

.filter-title {
font-weight: 700;
color: #1e293b;
margin-bottom: 1rem;
display: flex;
align-items: center;
gap: 0.5rem;
}

.counter-badge {
background: var(--background-gradient);
color: white;
padding: 0.5rem 1rem;
border-radius: 8px;
font-weight: 600;
display: inline-flex;
align-items: center;
gap: 0.5rem;
}

.search-container {
background: white;
border-radius: 12px;
padding: 1rem 1.5rem;
box-shadow: var(--card-shadow);
margin-bottom: 1.5rem;
}

.loading {
display: inline-flex;
align-items: center;
gap: 0.5rem;
color: var(--primary-color);
font-weight: 600;
}

.loading::before {
content: '';
width: 20px;
height: 20px;
border: 3px solid #e2e8f0;
border-top-color: var(--primary-color);
border-radius: 50%;
animation: spin 1s linear infinite;
}

@keyframes spin {
to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
<nav class="navbar navbar-expand-lg bg-body-tertiary">
 <div class="container-fluid">
 <a class="navbar-brand" href="/"><i class="fas fa-boxes me-2"></i>CCIS</a>
 <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
 <span class="navbar-toggler-icon"></span>
 </button>
 <div class="collapse navbar-collapse" id="navbarNav">
 <ul class="navbar-nav">
       <li class="nav-item">
         <a class="nav-link active" aria-current="page" href="/generar"><i class="fas fa-list me-1"></i>Generador de lista</a>
       </li>
       <li class="nav-item">
         <a class="nav-link" href="#"><i class="fas fa-check-circle me-1"></i>Validador</a>
       </li>
       
       <li class="nav-item">
         <a class="nav-link" href="/cargar" aria-current="page"><i class="fas fa-upload me-1"></i>Cargar Datos</a>
       </li>
    </ul>
 </div>
 </div>
</nav>


{% block content %}{% endblock %}
</div>
</body>
<footer>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js" integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous"></script>

</footer>
</html>
